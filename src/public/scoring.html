<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPC Pipeline · 质量评分</title>
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --surface2: #fafafa;
  --border: #ebebeb;
  --border-hairline: rgba(0,0,0,0.06);
  --text: #171717;
  --text-muted: #666666;
  --accent: #0072f5;
  --success: #3ecf8e;
  --warning: #d29922;
  --error: #f85149;
  --error-bg: rgba(248,81,73,0.08);
  --radius: 8px;
  --radius-sm: 6px;
  --shadow: 0px 0px 0px 1px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 48px 1fr;
}
.nav {
  background: var(--card);
  box-shadow: var(--shadow);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}
.nav h1 { font-size: 15px; font-weight: 600; }
.nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; }
.nav a:hover { color: var(--accent); }
.nav select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-left: 8px;
}
.workspace {
  display: grid;
  grid-template-columns: 260px 300px 1fr;
  overflow: hidden;
}
.task-sidebar {
  background: var(--surface2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.task-sidebar-header {
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
.task-list {
  overflow-y: auto;
  flex: 1;
  padding: 8px;
}
.task-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  border-left: 3px solid transparent;
  transition: all 0.15s ease;
}
.task-item:hover { background: var(--card); box-shadow: var(--shadow); }
.task-item.active {
  background: var(--card);
  border-left-color: var(--accent);
  box-shadow: var(--shadow);
}
.task-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.task-status.success { background: var(--success); }
.task-status.failed { background: var(--error); }
.task-status.unknown { background: var(--text-muted); }
.task-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-preview-icon {
  font-size: 11px;
  color: var(--accent);
}
.file-panel {
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.file-panel-header {
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.file-tree {
  overflow-y: auto;
  flex: 1;
  padding: 8px;
  font-size: 13px;
}
.file-tree .folder {
  cursor: pointer;
  user-select: none;
  margin: 2px 0;
  padding: 3px 0;
}
.file-tree .folder .name { font-weight: 600; color: var(--text); }
.file-tree .folder .toggle {
  display: inline-block;
  width: 14px;
  text-align: center;
  color: var(--text-muted);
  font-size: 11px;
}
.file-tree .file {
  cursor: pointer;
  padding: 3px 0 3px 20px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  border-radius: 4px;
}
.file-tree .file:hover { color: var(--text); background: var(--surface2); }
.file-tree .file.active { color: var(--text); background: var(--surface2); }
.file-icon { display: inline-block; width: 16px; text-align: center; font-size: 12px; }
.file-icon.js { color: #d4a843; }
.file-icon.py { color: #4a8fb8; }
.file-icon.html { color: #c9785c; }
.file-icon.css { color: #5b8fc7; }
.file-icon.md { color: var(--text-muted); }
.file-icon.json { color: #7ba85c; }
.file-icon.img { color: #bc8cff; }
.main-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-area {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.preview-toolbar {
  padding: 8px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}
.preview-toolbar .breadcrumb {
  color: var(--text-muted);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.preview-toolbar .breadcrumb .sep { color: var(--border); margin: 0 4px; }
.preview-toolbar button {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.preview-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
.preview-toolbar .preview-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
  background: var(--surface2);
  color: var(--text-muted);
}
.preview-content {
  flex: 1;
  overflow: auto;
  background: var(--bg);
  position: relative;
}
.preview-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-size: 13px;
}
.code-view {
  padding: 16px;
  font-family: 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', 'Fira Code', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.7;
  overflow-x: auto;
  white-space: pre;
  color: var(--text);
}
.code-view .line-num {
  display: inline-block;
  width: 40px;
  text-align: right;
  color: var(--text-muted);
  margin-right: 12px;
  user-select: none;
  opacity: 0.5;
}
.hl-string { color: #0969da; }
.hl-comment { color: var(--text-muted); font-style: italic; }
.hl-keyword { color: #cf222e; font-weight: 600; }
.hl-number { color: #0550ae; }
.hl-function { color: #8250df; }
.html-preview iframe, .img-preview img {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.img-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.img-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.binary-notice {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-size: 14px;
  flex-direction: column;
  gap: 8px;
}
.score-area {
  min-height: 280px;
  max-height: 55vh;
  flex-shrink: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 20px;
}
.score-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
}
.score-card {
  background: var(--surface2);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius);
  padding: 16px;
}
.score-card h3 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.score-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.grade-badge {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.grade-badge.A { background: var(--error); }
.grade-badge.B { background: var(--warning); }
.grade-badge.C { background: var(--success); }
.score-meta {
  font-size: 12px;
  color: var(--text-muted);
}
.score-meta .score-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.dimension-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-hairline);
  font-size: 12px;
}
.dimension-row:last-child { border-bottom: none; }
.dimension-name { color: var(--text-muted); width: 80px; }
.dimension-bar-bg {
  flex: 1;
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  margin: 0 10px;
  overflow: hidden;
}
.dimension-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s ease;
}
.dimension-bar.high { background: var(--success); }
.dimension-bar.medium { background: var(--warning); }
.dimension-bar.low { background: var(--error); }
.dimension-value {
  font-weight: 600;
  width: 30px;
  text-align: right;
  font-size: 12px;
}
.issues-list { margin-top: 8px; }
.issue-card {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin-bottom: 6px;
  border-left: 3px solid;
  font-size: 12px;
}
.issue-card.level-A { border-left-color: var(--error); }
.issue-card.level-B { border-left-color: var(--warning); }
.issue-card.level-C { border-left-color: var(--accent); }
.issue-header { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.issue-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  text-transform: uppercase;
}
.issue-badge.level-A { background: var(--error-bg); color: var(--error); }
.issue-badge.level-B { background: rgba(210,153,34,0.1); color: var(--warning); }
.issue-badge.level-C { background: rgba(0,114,245,0.1); color: var(--accent); }
.issue-category { color: var(--text-muted); }
.issue-desc { margin-bottom: 2px; }
.issue-suggestion { color: var(--text-muted); font-style: italic; font-size: 11px; }
.no-issues { color: var(--text-muted); font-size: 12px; text-align: center; padding: 12px; }
.human-score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-hairline);
  font-size: 12px;
}
.human-score-row:last-child { border-bottom: none; }
.stars { display: flex; gap: 3px; }
.star {
  font-size: 16px;
  cursor: pointer;
  color: var(--border);
  transition: color 0.2s;
  user-select: none;
}
.star:hover, .star.active { color: var(--warning); }
.star-value { font-size: 11px; color: var(--text-muted); margin-left: 6px; min-width: 20px; }
.notes-area {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  resize: vertical;
  min-height: 60px;
  margin-top: 8px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
}
.notes-area:focus { outline: none; border-color: var(--accent); }
.action-buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.action-buttons button {
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.saved-toast {
  position: fixed;
  top: 56px;
  right: 20px;
  background: var(--success);
  color: #fff;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 100;
}
.saved-toast.show { opacity: 1; }
.empty-tasks {
  padding: 20px;
  color: var(--text-muted);
  font-size: 12px;
  text-align: center;
}
.loading-files {
  padding: 20px;
  color: var(--text-muted);
  font-size: 12px;
  text-align: center;
}
</style>
</head>
<body>
<div class="nav">
  <div style="display:flex;align-items:center;gap:12px;">
    <h1>OPC Pipeline · 质量评分</h1>
    <span style="color:var(--text-muted);font-size:13px;">轮次：</span>
    <select id="roundSelect" onchange="changeRound()"></select>
  </div>
  <a href="/">← 返回监控</a>
</div>
<div class="workspace">
  <div class="task-sidebar">
    <div class="task-sidebar-header">任务列表</div>
    <div class="task-list" id="taskList">
      <div class="empty-tasks">加载中...</div>
    </div>
  </div>
  <div class="file-panel">
    <div class="file-panel-header">
      <span>文件</span>
      <span id="fileCount" style="font-size:11px;color:var(--text-muted);font-weight:400;"></span>
    </div>
    <div class="file-tree" id="fileTree">
      <div class="empty-tasks">选择任务查看文件</div>
    </div>
  </div>
  <div class="main-panel">
    <div class="preview-area">
      <div class="preview-toolbar" id="previewToolbar" style="display:none;">
        <button onclick="backToFileTree()">← 返回</button>
        <span class="breadcrumb" id="breadcrumb"></span>
        <span class="preview-badge" id="previewBadge"></span>
      </div>
      <div class="preview-content" id="previewContent">
        <div class="preview-empty">选择文件预览</div>
      </div>
    </div>
    <div class="score-area" id="scoreArea">
      <div class="score-grid" id="scoreGrid">
        <div class="score-card">
          <h3>自动评分</h3>
          <div class="score-header">
            <div class="grade-badge C" id="autoGrade">-</div>
            <div class="score-meta">
              <div class="score-value" id="autoTotal">-</div>
              <div>/100</div>
            </div>
          </div>
          <div id="autoDimensions"></div>
        </div>
        <div class="score-card">
          <h3>Review 评分</h3>
          <div class="score-header">
            <div class="grade-badge C" id="reviewGrade">-</div>
            <div class="score-meta">
              <div class="score-value" id="reviewTotal">-</div>
              <div>/100</div>
            </div>
          </div>
          <div id="reviewDimensions"></div>
          <div class="issues-list" id="reviewIssues"></div>
        </div>
        <div class="score-card">
          <h3>人工评分</h3>
          <div id="humanDimensions"></div>
          <textarea class="notes-area" id="notes" placeholder="备注..."></textarea>
          <div class="action-buttons">
            <button class="btn-primary" onclick="saveScore()">保存</button>
            <button class="btn-secondary" onclick="resetScore()">重置</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="saved-toast" id="toast">已保存</div>

<script>
let currentRound = '';
let currentTaskId = '';
let rounds = [];
let taskList = [];
let taskFiles = [];
let reviewData = null;
let autoScore = null;
let humanScore = null;
let selectedFilePath = null;

const HUMAN_DIMS = [
  { key: 'completeness', label: '功能完成度' },
  { key: 'codeQuality', label: '代码质量' },
  { key: 'runnability', label: '可运行性' },
  { key: 'security', label: '安全性' },
  { key: 'satisfaction', label: '整体满意度' }
];

const REVIEW_DIM_MAP = {
  requirement_fulfillment: '需求实现度',
  code_quality: '代码质量',
  maintainability: '可维护性',
  security: '安全性'
};

const PREVIEWABLE_IMG = new Set(['.png', '.jpg', '.jpeg', '.gif', '.svg']);
const PREVIEWABLE_CODE = new Set(['.js', '.py', '.html', '.css', '.md', '.json', '.ts', '.tsx', '.jsx', '.vue', '.sh', '.yml', '.yaml', '.txt']);

async function init() {
  await loadRounds();
  if (rounds.length > 0) {
    currentRound = rounds[rounds.length - 1].roundId;
    document.getElementById('roundSelect').value = currentRound;
    await loadRoundTasks(currentRound);
  }
}

async function loadRounds() {
  try {
    const res = await fetch('/api/rounds');
    rounds = await res.json();
    const sel = document.getElementById('roundSelect');
    sel.innerHTML = '';
    for (const r of rounds) {
      const opt = document.createElement('option');
      opt.value = r.roundId;
      opt.textContent = `${r.roundId} (${r.date} · ${r.taskCount}任务)`;
      sel.appendChild(opt);
    }
  } catch (e) { console.error('loadRounds failed', e); }
}

async function changeRound() {
  currentRound = document.getElementById('roundSelect').value;
  currentTaskId = '';
  reviewData = null;
  autoScore = null;
  humanScore = null;
  selectedFilePath = null;
  await loadRoundTasks(currentRound);
}

async function loadRoundTasks(roundId) {
  try {
    const res = await fetch(`/api/rounds/${roundId}/tasks`);
    taskList = await res.json();
    renderTaskList();
    if (taskList.length > 0 && !currentTaskId) {
      selectTask(taskList[0].taskId);
    }
  } catch (e) {
    document.getElementById('taskList').innerHTML = '<div class="empty-tasks">加载失败</div>';
  }
}

function renderTaskList() {
  const container = document.getElementById('taskList');
  if (taskList.length === 0) {
    container.innerHTML = '<div class="empty-tasks">该轮次无任务</div>';
    return;
  }
  let html = '';
  for (const t of taskList) {
    const active = t.taskId === currentTaskId ? 'active' : '';
    const previewIcon = t.hasOutput ? '<span class="task-preview-icon">👁</span>' : '';
    html += `<div class="task-item ${active}" onclick="selectTask('${t.taskId}')">
      <div class="task-status ${t.status}"></div>
      <div class="task-name">${t.taskId}</div>
      ${previewIcon}
    </div>`;
  }
  container.innerHTML = html;
}

async function selectTask(taskId) {
  currentTaskId = taskId;
  selectedFilePath = null;
  reviewData = null;
  autoScore = null;
  humanScore = null;
  taskFiles = [];
  document.getElementById('fileTree').innerHTML = '<div class="loading-files">加载中...</div>';
  document.getElementById('fileCount').textContent = '';
  renderTaskList();
  resetPreview();

  await Promise.all([
    loadTaskFiles(taskId),
    loadScores(taskId),
    loadReviewScores(taskId)
  ]);
}

async function loadTaskFiles(taskId) {
  try {
    const res = await fetch(`/api/rounds/${currentRound}/tasks/${taskId}/files`);
    taskFiles = await res.json();
    document.getElementById('fileCount').textContent = `${taskFiles.length} 个文件`;
    if (taskFiles.length === 0) {
      document.getElementById('fileTree').innerHTML = '<div class="empty-tasks">无产出文件</div>';
      return;
    }
    renderFileTree(taskFiles);
  } catch (e) {
    document.getElementById('fileTree').innerHTML = '<div class="empty-tasks">加载失败</div>';
  }
}

async function loadScores(taskId) {
  try {
    const res = await fetch(`/api/rounds/${currentRound}/scores`);
    const data = await res.json();
    autoScore = data.autoScores?.[taskId] || null;
    humanScore = data.humanScores?.[taskId] || null;
    renderAutoScore();
    renderHumanScore();
  } catch (e) {
    renderAutoScore();
    renderHumanScore();
  }
}

async function loadReviewScores(taskId) {
  try {
    const res = await fetch(`/api/rounds/${currentRound}/tasks/${taskId}/file?p=review-scores.json`);
    if (!res.ok) {
      renderReviewScore();
      return;
    }
    const data = await res.json();
    if (data.binary || !data.content) {
      renderReviewScore();
      return;
    }
    const parsed = JSON.parse(data.content);
    reviewData = parsed.review || parsed;
    renderReviewScore();
  } catch (e) {
    renderReviewScore();
  }
}

function renderAutoScore() {
  const totalEl = document.getElementById('autoTotal');
  const gradeEl = document.getElementById('autoGrade');
  const dimsEl = document.getElementById('autoDimensions');

  if (!autoScore) {
    totalEl.textContent = '-';
    gradeEl.textContent = '-';
    gradeEl.className = 'grade-badge C';
    dimsEl.innerHTML = '';
    return;
  }

  totalEl.textContent = autoScore.totalScore;
  const grade = getGrade(autoScore.totalScore);
  gradeEl.textContent = grade;
  gradeEl.className = `grade-badge ${grade}`;

  const dimMap = {
    completeness: '功能完成度', security: '安全性', stability: '稳定性',
    codeQuality: '代码规范度', efficiency: '效率'
  };
  let html = '';
  for (const [key, info] of Object.entries(autoScore.dimensions || {})) {
    const pct = info.score || 0;
    const cls = pct >= 80 ? 'high' : (pct >= 60 ? 'medium' : 'low');
    html += `<div class="dimension-row">
      <span class="dimension-name">${dimMap[key] || key}</span>
      <div class="dimension-bar-bg"><div class="dimension-bar ${cls}" style="width:${pct}%"></div></div>
      <span class="dimension-value">${info.score}</span>
    </div>`;
  }
  dimsEl.innerHTML = html;
}

function renderReviewScore() {
  const totalEl = document.getElementById('reviewTotal');
  const gradeEl = document.getElementById('reviewGrade');
  const dimsEl = document.getElementById('reviewDimensions');
  const issuesEl = document.getElementById('reviewIssues');

  if (!reviewData || !reviewData.scores) {
    totalEl.textContent = '-';
    gradeEl.textContent = '-';
    gradeEl.className = 'grade-badge C';
    dimsEl.innerHTML = '';
    issuesEl.innerHTML = '';
    return;
  }

  const scores = reviewData.scores;
  const grade = reviewData.grade || 'C';
  const avg = Math.round(Object.values(scores).reduce((a, b) => a + b, 0) / Object.values(scores).length);

  totalEl.textContent = avg;
  gradeEl.textContent = grade;
  gradeEl.className = `grade-badge ${grade}`;

  let html = '';
  for (const [key, value] of Object.entries(scores)) {
    const pct = Math.min(100, Math.max(0, value));
    const cls = pct >= 80 ? 'high' : (pct >= 60 ? 'medium' : 'low');
    html += `<div class="dimension-row">
      <span class="dimension-name">${REVIEW_DIM_MAP[key] || key}</span>
      <div class="dimension-bar-bg"><div class="dimension-bar ${cls}" style="width:${pct}%"></div></div>
      <span class="dimension-value">${value}</span>
    </div>`;
  }
  dimsEl.innerHTML = html;

  const issues = reviewData.issues || [];
  if (issues.length === 0) {
    issuesEl.innerHTML = '<div class="no-issues">未发现问题</div>';
  } else {
    let ihtml = `<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">${issues.length} 条建议</div>`;
    for (const issue of issues.slice(0, 5)) {
      ihtml += `<div class="issue-card level-${issue.level}">
        <div class="issue-header">
          <span class="issue-badge level-${issue.level}">${issue.level}级</span>
          <span class="issue-category">${issue.category || ''}</span>
        </div>
        <div class="issue-desc">${(issue.desc || '').replace(/</g, '&lt;')}</div>
        ${issue.suggestion ? `<div class="issue-suggestion">💡 ${issue.suggestion.replace(/</g, '&lt;')}</div>` : ''}
      </div>`;
    }
    if (issues.length > 5) {
      ihtml += `<div class="no-issues">还有 ${issues.length - 5} 条建议...</div>`;
    }
    issuesEl.innerHTML = ihtml;
  }
}

function renderHumanScore() {
  const container = document.getElementById('humanDimensions');
  container.innerHTML = '';
  for (const dim of HUMAN_DIMS) {
    const val = humanScore?.dimensions?.[dim.key] || 0;
    const row = document.createElement('div');
    row.className = 'human-score-row';
    let starsHtml = '';
    for (let i = 1; i <= 5; i++) {
      starsHtml += `<span class="star ${i <= val ? 'active' : ''}" data-dim="${dim.key}" data-val="${i}" onclick="setStar('${dim.key}', ${i})">★</span>`;
    }
    row.innerHTML = `<span>${dim.label}</span>
      <div class="stars">${starsHtml}<span class="star-value" id="star-${dim.key}">${val}/5</span></div>`;
    container.appendChild(row);
  }
  document.getElementById('notes').value = humanScore?.notes || '';
}

function setStar(dim, val) {
  const stars = document.querySelectorAll(`[data-dim="${dim}"]`);
  stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.val) <= val));
  document.getElementById(`star-${dim}`).textContent = val + '/5';
}

function getHumanScore() {
  const dims = {};
  for (const dim of HUMAN_DIMS) {
    const active = document.querySelectorAll(`[data-dim="${dim.key}"].active`);
    dims[dim.key] = active.length;
  }
  return { dimensions: dims, notes: document.getElementById('notes').value };
}

async function saveScore() {
  try {
    await fetch(`/api/rounds/${currentRound}/scores/${currentTaskId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(getHumanScore())
    });
    humanScore = getHumanScore();
    showToast('已保存');
  } catch (e) { showToast('保存失败'); }
}

function resetScore() {
  humanScore = null;
  renderHumanScore();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function getGrade(score) {
  if (score >= 90) return 'A';
  if (score >= 70) return 'B';
  return 'C';
}

function renderFileTree(files) {
  const tree = buildTree(files);
  const container = document.getElementById('fileTree');
  container.innerHTML = '';
  renderNode(tree, container, 0);
}

function buildTree(files) {
  const root = {};
  for (const f of files) {
    const parts = f.path.split('/');
    let cur = root;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (i === parts.length - 1) {
        cur[p] = { ...f, isFile: true };
      } else {
        cur[p] = cur[p] || {};
        cur = cur[p];
      }
    }
  }
  return root;
}

function renderNode(node, container, depth) {
  const entries = Object.entries(node).sort((a, b) => {
    const aFile = a[1].isFile;
    const bFile = b[1].isFile;
    if (aFile !== bFile) return aFile ? 1 : -1;
    return a[0].localeCompare(b[0]);
  });
  for (const [name, info] of entries) {
    if (info.isFile) {
      const el = document.createElement('div');
      el.className = 'file';
      const iconClass = getFileIconClass(info.ext);
      el.innerHTML = `<span class="file-icon ${iconClass}">${getFileIcon(info.ext)}</span>${name}`;
      el.onclick = () => selectFile(info.path);
      container.appendChild(el);
    } else {
      const folder = document.createElement('div');
      folder.innerHTML = `<div class="folder" onclick="toggleFolder(this)"><span class="toggle">▼</span> <span class="name">${name}/</span></div>`;
      const childContainer = document.createElement('div');
      childContainer.style.paddingLeft = '12px';
      renderNode(info, childContainer, depth + 1);
      folder.appendChild(childContainer);
      container.appendChild(folder);
    }
  }
}

function toggleFolder(el) {
  const child = el.nextElementSibling;
  const toggle = el.querySelector('.toggle');
  if (child) {
    child.style.display = child.style.display === 'none' ? 'block' : 'none';
    toggle.textContent = child.style.display === 'none' ? '▶' : '▼';
  }
}

function getFileIcon(ext) {
  const map = {
    '.js': '📜', '.py': '🐍', '.html': '🌐', '.css': '🎨',
    '.md': '📝', '.json': '📋', '.ts': '📘', '.sh': '⚡',
    '.png': '🖼', '.jpg': '🖼', '.jpeg': '🖼', '.gif': '🖼', '.svg': '🖼'
  };
  return map[ext] || '📄';
}

function getFileIconClass(ext) {
  if (['.png', '.jpg', '.jpeg', '.gif', '.svg'].includes(ext)) return 'img';
  const map = { '.js': 'js', '.py': 'py', '.html': 'html', '.css': 'css', '.md': 'md', '.json': 'json' };
  return map[ext] || '';
}

async function selectFile(filePath) {
  selectedFilePath = filePath;
  document.querySelectorAll('.file').forEach(f => f.classList.remove('active'));
  event.target.closest('.file')?.classList.add('active');

  const ext = (filePath.split('.').pop() || '').toLowerCase();
  const fullExt = '.' + ext;
  const previewUrl = `/preview/${currentRound}/${currentTaskId}/${filePath}`;

  document.getElementById('previewToolbar').style.display = 'flex';
  document.getElementById('breadcrumb').innerHTML = `<span>${currentTaskId}</span><span class="sep">/</span><span>${filePath}</span>`;

  if (fullExt === '.html') {
    document.getElementById('previewBadge').textContent = 'HTML 渲染';
    document.getElementById('previewContent').innerHTML = `<div class="html-preview"><iframe sandbox="allow-scripts" src="${previewUrl}"></iframe></div>`;
  } else if (PREVIEWABLE_IMG.has(fullExt)) {
    document.getElementById('previewBadge').textContent = '图片预览';
    document.getElementById('previewContent').innerHTML = `<div class="img-preview"><img src="${previewUrl}" alt="${filePath}"></div>`;
  } else if (PREVIEWABLE_CODE.has(fullExt)) {
    document.getElementById('previewBadge').textContent = '代码';
    try {
      const res = await fetch(`/api/rounds/${currentRound}/tasks/${currentTaskId}/file?p=${encodeURIComponent(filePath)}`);
      const data = await res.json();
      if (data.binary) {
        showBinaryNotice();
      } else {
        document.getElementById('previewContent').innerHTML = `<div class="code-view">${highlightCode(data.content || '', ext)}</div>`;
      }
    } catch (e) {
      document.getElementById('previewContent').innerHTML = '<div class="preview-empty">加载失败</div>';
    }
  } else {
    document.getElementById('previewBadge').textContent = '二进制';
    showBinaryNotice();
  }
}

function showBinaryNotice() {
  document.getElementById('previewContent').innerHTML = `
  <div class="binary-notice">
    <div>📦 二进制文件，无法预览</div>
    <div style="font-size:12px;">${selectedFilePath || ''}</div>
  </div>`;
}

function backToFileTree() {
  selectedFilePath = null;
  document.getElementById('previewToolbar').style.display = 'none';
  document.getElementById('previewContent').innerHTML = '<div class="preview-empty">选择文件预览</div>';
  document.querySelectorAll('.file').forEach(f => f.classList.remove('active'));
}

function resetPreview() {
  selectedFilePath = null;
  document.getElementById('previewToolbar').style.display = 'none';
  document.getElementById('previewContent').innerHTML = '<div class="preview-empty">选择文件预览</div>';
}

function highlightCode(code, lang) {
  let escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  escaped = escaped.replace(/('.*?'|".*?"|`.*?`)/g, '<span class="hl-string">$1</span>');
  escaped = escaped.replace(/(\/\/.*)/g, '<span class="hl-comment">$1</span>');
  escaped = escaped.replace(/\b(function|const|let|var|return|if|else|for|while|import|export|from|require|class|extends|async|await|try|catch|throw|new|this|true|false|null|undefined)\b/g, '<span class="hl-keyword">$1</span>');
  escaped = escaped.replace(/\b(\d+\.?\d*)\b/g, '<span class="hl-number">$1</span>');
  const lines = escaped.split('\n');
  return lines.map((line, i) => `<span class="line-num">${i + 1}</span>${line}`).join('\n');
}

init();
</script>
